version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: airastana-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - airastana-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Redis Commander (web UI for Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: airastana-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - airastana-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local

networks:
  airastana-network:
    driver: bridge